<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neczx Store | Halloween</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Nosifer&display=swap');
:root{--bg:#100b18;--card:#21152d;--card2:#2c1b3d;--orange:#ff7518;--purple:#a855f7;--text:#fff7ed;--muted:#cbb8d8;--green:#66e3a5;--red:#ff7070}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#44135c,#100b18 48%);color:var(--text);font-family:Kanit,Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:#100b18ed;border-bottom:1px solid #43265b;backdrop-filter:blur(12px)}nav,.wrap{max-width:1180px;margin:auto}nav{padding:16px 22px;display:flex;gap:12px;align-items:center}.logo{font:22px Nosifer;color:var(--orange);text-shadow:0 0 15px #ff751888;margin-right:auto}.btn,.navbtn{border-radius:10px;padding:10px 15px;font:inherit;cursor:pointer}.btn{border:0;color:#fff;background:var(--purple)}.btn:hover{filter:brightness(1.15)}.navbtn{color:#fff;background:transparent;border:1px solid #694283}.hero{margin:40px 22px 25px;padding:48px 30px;border:1px solid #5a2d74;border-radius:25px;background:linear-gradient(110deg,#351347,#171020);position:relative;overflow:hidden}.hero:after{content:'☾';font-size:230px;position:absolute;right:7%;top:-38px;color:#ff75181e}.hero h1{font-size:clamp(42px,8vw,78px);line-height:1;margin:0 0 14px}.hero h1 span{color:var(--orange)}.hero p{color:var(--muted);font-size:18px;max-width:560px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:25px 0 15px;gap:12px}.search,.input,textarea,select{background:#140d1c;color:#fff;border:1px solid #654078;border-radius:9px;padding:11px;font:inherit}.search{width:240px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.product{background:var(--card);border:1px solid #42265a;border-radius:17px;overflow:hidden;display:flex;flex-direction:column}.product img{width:100%;height:220px;object-fit:cover}.info{padding:15px;display:flex;flex-direction:column;gap:7px;flex:1}.info h3{margin:0;font-size:20px}.desc{color:var(--muted);min-height:40px;font-size:14px}.price{font-size:21px;color:var(--orange);font-weight:700}.stock{font-size:13px;color:var(--green)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.modal{display:none;position:fixed;z-index:20;inset:0;background:#000c;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{width:min(470px,100%);max-height:90vh;overflow:auto;background:var(--card2);border:1px solid #75489a;border-radius:17px;padding:23px}.box h2{margin-top:0}.close{float:right;background:none;border:0;color:white;font-size:25px;cursor:pointer}.input,textarea,select{display:block;width:100%;margin:7px 0 12px}.notice{background:#4a2637;color:#ffd0d0;border-radius:8px;padding:10px;margin:10px 0}.cartline{padding:11px 0;border-bottom:1px solid #4a2d5c;display:flex;justify-content:space-between;gap:10px}.admin{border-top:1px solid #48275c;margin-top:36px;padding-top:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid #4a2d5c;vertical-align:top}.small{color:var(--muted);font-size:13px}.hidden{display:none!important}@media(max-width:600px){nav{padding:12px}.hero{margin:20px 12px;padding:32px 20px}.wrap{padding:0 12px 60px}.toolbar{align-items:flex-start;flex-direction:column}.search{width:100%}}
</style>
</head>
<body>
<header><nav><div class="logo">NECZX</div><button class="navbtn" id="loginBtn" onclick="openAuth('login')">เข้าสู่ระบบ</button><button class="navbtn hidden" id="logoutBtn" onclick="logout()">ออกจากระบบ</button><button class="btn" onclick="openCart()">ตะกร้า (<span id="cartCount">0</span>)</button></nav></header>
<main class="wrap"><section class="hero"><h1>คืนหลอน<br><span>ช้อปให้สุด</span></h1><p>คอลเลกชันฮาโลวีนจาก Neczx Store ของแต่งบ้าน แฟชั่น และไอเทมลึกลับสำหรับปาร์ตี้ของคุณ</p><button class="btn" onclick="document.querySelector('#products').scrollIntoView({behavior:'smooth'})">ดูสินค้าทั้งหมด</button></section>
<div class="toolbar"><h2 id="products">สินค้าแนะนำ</h2><input class="search" id="search" oninput="renderProducts()" placeholder="ค้นหาสินค้า..."></div><section id="productGrid" class="grid"></section><section id="adminArea" class="admin hidden"></section></main>
<div id="authModal" class="modal"><div class="box"><button class="close" onclick="closeModals()">×</button><h2 id="authTitle">เข้าสู่ระบบ</h2><div id="authNotice"></div><input id="authUser" class="input" placeholder="ยูสเซอร์"><input id="authPass" class="input" type="password" placeholder="รหัสผ่าน"><button class="btn" style="width:100%" onclick="submitAuth()">ยืนยัน</button><p id="switchText" class="small">ยังไม่มีบัญชี? <a href="#" onclick="openAuth('register')">สมัครสมาชิก</a></p></div></div>
<div id="cartModal" class="modal"><div class="box"><button class="close" onclick="closeModals()">×</button><h2>ตะกร้าของคุณ</h2><div id="cartItems"></div><div class="row"><b>รวม</b><b id="cartTotal" class="price">฿0</b></div><textarea id="address" class="input" placeholder="ที่อยู่จัดส่ง"></textarea><button class="btn" style="width:100%" onclick="checkout()">ยืนยันคำสั่งซื้อ</button></div></div>
<script>
const key='neczx_html_store_v1';
let state=JSON.parse(localStorage.getItem(key)||'null')||{users:[{username:'admin',password:'0902798022',role:'admin'}],products:[
{id:1,name:'เสื้อคลุมแม่มด Midnight',desc:'เสื้อคลุมสีดำลายพระจันทร์',price:590,stock:12,img:'https://images.unsplash.com/photo-1509248961158-e54f6934749c?auto=format&fit=crop&w=900&q=80'},
{id:2,name:'โคมไฟฟักทอง Pumpkin Glow',desc:'โคมไฟตกแต่งโต๊ะแสงส้มอบอุ่น',price:390,stock:20,img:'https://images.unsplash.com/photo-1508361001413-7de7d0f5f7b8?auto=format&fit=crop&w=900&q=80'},
{id:3,name:'หน้ากาก Phantom',desc:'หน้ากากแฟนซีสำหรับปาร์ตี้คอสตูม',price:250,stock:15,img:'https://images.unsplash.com/photo-1603912699214-92627f304eb6?auto=format&fit=crop&w=900&q=80'}],orders:[],current:null,cart:[]};
const $=x=>document.getElementById(x),money=n=>'฿'+Number(n).toLocaleString('th-TH');function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderProducts(){let q=$('search').value.toLowerCase();let ps=state.products.filter(p=>(p.name+p.desc).toLowerCase().includes(q));$('productGrid').innerHTML=ps.map(p=>`<article class="product"><img src="${p.img||''}" onerror="this.style.opacity=.2"><div class="info"><h3>${esc(p.name)}</h3><div class="desc">${esc(p.desc)}</div><div class="stock">เหลือ ${p.stock} ชิ้น</div><div class="row"><span class="price">${money(p.price)}</span><button class="btn" onclick="addCart(${p.id})" ${p.stock<1?'disabled':''}>ใส่ตะกร้า</button></div></div></article>`).join('')||'<p>ไม่พบสินค้า</p>'}
function nav(){let logged=!!state.current;$('loginBtn').classList.toggle('hidden',logged);$('logoutBtn').classList.toggle('hidden',!logged);$('cartCount').textContent=state.cart.reduce((a,x)=>a+x.qty,0);if(state.current?.role==='admin')loadAdmin();else $('adminArea').classList.add('hidden')}
function addCart(id){let x=state.cart.find(x=>x.id===id);if(x)x.qty++;else state.cart.push({id,qty:1});save();nav();alert('เพิ่มสินค้าลงตะกร้าแล้ว')}
function openCart(){let total=0;$('cartItems').innerHTML=state.cart.map(x=>{let p=state.products.find(p=>p.id===x.id);if(!p)return '';total+=p.price*x.qty;return `<div class="cartline"><span>${esc(p.name)} × ${x.qty}</span><span>${money(p.price*x.qty)} <button class="navbtn" onclick="removeCart(${p.id})">ลบ</button></span></div>`}).join('')||'<p class="small">ยังไม่มีสินค้าในตะกร้า</p>';$('cartTotal').textContent=money(total);$('cartModal').classList.add('show')}
function removeCart(id){state.cart=state.cart.filter(x=>x.id!==id);save();nav();openCart()}function closeModals(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('show'))}
function openAuth(mode){window.authMode=mode;$('authTitle').textContent=mode==='login'?'เข้าสู่ระบบ':'สมัครสมาชิก';$('authNotice').innerHTML='';$('switchText').innerHTML=mode==='login'?'ยังไม่มีบัญชี? <a href="#" onclick="openAuth(\'register\')">สมัครสมาชิก</a>':'มีบัญชีแล้ว? <a href="#" onclick="openAuth(\'login\')">เข้าสู่ระบบ</a>';$('authModal').classList.add('show')}
function submitAuth(){let u=$('authUser').value.trim(),p=$('authPass').value;if(window.authMode==='register'){if(u.length<3||p.length<6)return $('authNotice').innerHTML='<div class="notice">ยูสเซอร์อย่างน้อย 3 ตัว และรหัสผ่านอย่างน้อย 6 ตัว</div>';if(state.users.some(x=>x.username===u))return $('authNotice').innerHTML='<div class="notice">ยูสเซอร์นี้มีแล้ว</div>';state.users.push({username:u,password:p,role:'customer'});state.current={username:u,role:'customer'}}else{let user=state.users.find(x=>x.username===u&&x.password===p);if(!user)return $('authNotice').innerHTML='<div class="notice">ยูสเซอร์หรือรหัสผ่านไม่ถูกต้อง</div>';state.current={username:user.username,role:user.role}}save();closeModals();nav();alert('เข้าสู่ระบบสำเร็จ')}
function logout(){state.current=null;save();nav()}function checkout(){if(!state.current){closeModals();return openAuth('login')}let address=$('address').value.trim();if(address.length<8)return alert('กรุณาใส่ที่อยู่จัดส่ง');if(!state.cart.length)return alert('ยังไม่มีสินค้าในตะกร้า');let items=[],total=0;for(let x of state.cart){let p=state.products.find(p=>p.id===x.id);if(!p||x.qty>p.stock)return alert('สินค้าไม่พอในสต็อก');p.stock-=x.qty;total+=p.price*x.qty;items.push({name:p.name,qty:x.qty,price:p.price})}let id=Date.now().toString().slice(-6);state.orders.unshift({id,user:state.current.username,address,total,status:'รอดำเนินการ',items,date:new Date().toLocaleString('th-TH')});state.cart=[];save();renderProducts();nav();closeModals();alert('สั่งซื้อสำเร็จ เลขที่ออเดอร์ #'+id)}
function loadAdmin(){let a=$('adminArea');a.classList.remove('hidden');a.innerHTML=`<h2>แผงควบคุมแอดมิน</h2><p class="small">บัญชีแอดมิน: ${esc(state.current.username)}</p><form onsubmit="addProduct(event)" class="row" style="flex-wrap:wrap"><input id="pn" class="input" style="flex:1;min-width:150px" placeholder="ชื่อสินค้า" required><input id="pp" class="input" style="width:100px" type="number" placeholder="ราคา" required><input id="ps" class="input" style="width:100px" type="number" placeholder="สต็อก" required><input id="pi" class="input" style="flex:1;min-width:180px" placeholder="ลิงก์รูปภาพ"><button class="btn">เพิ่มสินค้า</button></form><h3>ออเดอร์ทั้งหมด</h3><table class="table"><tr><th>#</th><th>ลูกค้า</th><th>รายการ</th><th>ยอด</th><th>สถานะ</th></tr>${state.orders.map(o=>`<tr><td>${o.id}</td><td>${esc(o.user)}<br><span class="small">${esc(o.address)}</span></td><td>${o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</td><td>${money(o.total)}</td><td><select onchange="changeStatus('${o.id}',this.value)">${['รอดำเนินการ','กำลังจัดส่ง','สำเร็จ','ยกเลิก'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="5">ยังไม่มีออเดอร์</td></tr>'}</table>`}
function addProduct(e){e.preventDefault();state.products.push({id:Date.now(),name:$('pn').value,desc:'สินค้าใหม่จากแอดมิน',price:+$('pp').value,stock:+$('ps').value,img:$('pi').value});save();renderProducts();loadAdmin();e.target.reset()}function changeStatus(id,s){let o=state.orders.find(x=>x.id===id);if(o)o.status=s;save();loadAdmin()}renderProducts();nav();
</script></body></html>
